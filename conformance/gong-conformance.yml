data_privacy_api:
  note: >-
    Gong ships GDPR/CCPA erasure as first-class API operations rather than only
    a support process: deleteEmailAddressData, deletePhoneNumberData,
    retrieveEmailReferences and retrievePhoneReferences under
    /v2/data-privacy/*. That is a genuine regulatory-conformance surface an
    automated data-subject-request pipeline can call.
  operations: [retrieveEmailReferences, retrievePhoneReferences, deleteEmailAddressData, deletePhoneNumberData]
