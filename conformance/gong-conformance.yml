standards:
- id: oauth2
  conforms: true
  evidence: >-
    Authorization-code flow documented at app.gong.io/oauth2/authorize with
    token exchange at /oauth2/generate-customer-token, HTTP Basic client
    authentication, refresh tokens and a space-delimited scope parameter. Gong
    cites RFC 6749 explicitly.
  source: https://help.gong.io/docs/create-an-app-for-gong
- id: rfc6750-bearer-token
  conforms: true
  evidence: 'Authorization: Bearer <token>; Gong cites RFC 6750. The MCP server returns a compliant WWW-Authenticate Bearer challenge.'
- id: rfc7617-http-basic
  conforms: true
  evidence: 'Authorization: Basic Base64(accessKey:accessKeySecret); Gong cites RFC 7617.'
- id: rfc8414-oauth-authorization-server-metadata
  conforms: true
  evidence: https://mcp.gong.io/.well-known/oauth-authorization-server returns 200 with issuer, authorization_endpoint, token_endpoint, grant_types_supported, scopes_supported and code_challenge_methods_supported.
  scope: MCP surface only — the REST v2 surface publishes no such metadata.
- id: rfc9728-oauth-protected-resource-metadata
  conforms: true
  evidence: https://mcp.gong.io/.well-known/oauth-protected-resource/mcp returns 200 with authorization_servers, resource and scopes_supported, and is advertised in the 401 WWW-Authenticate challenge.
  scope: MCP surface only.
- id: rfc7636-pkce
  conforms: true
  evidence: 'code_challenge_methods_supported: [S256] on the MCP authorization server metadata.'
  scope: MCP surface only.
- id: mcp
  conforms: true
