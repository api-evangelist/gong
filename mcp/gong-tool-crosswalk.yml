note: >-
  The crosswalk's headline finding is a clean SURFACE SPLIT, not an overlap.
  Gong's MCP server exposes three AI-synthesis tools backed by two APIs
  (ask-entity, get-brief) that are NOT part of the documented public REST v2
  surface and appear in no OpenAPI in this repo. The REST surface is 57
  record-level CRUD/retrieval operations. There is therefore ZERO binding
  between the two: every MCP tool is mcp_only and every REST operation is
  rest_only. An agent that can reach mcp.gong.io cannot list a call, and an
  agent holding a REST key cannot ask a question about a deal.
