scope_note: >-
  The auth surfaces are split as cleanly as the capabilities. REST v2 uses
  api:* scopes (api:calls:read:basic, api:flows:read, ...) or an Access
  Key/Secret over HTTP Basic; the MCP server uses a disjoint mcp:* scope family
  (mcp:ai-ask:read, mcp:ai-briefer:read, mcp:ai-assistant:read) issued from a
  separate token endpoint. A credential for one surface never works on the other.
