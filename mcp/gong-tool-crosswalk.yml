mcp_only:
- tool: ask_account
  reason: >-
    Backed by the ask-entity API, an AI-synthesis endpoint Gong does not publish
    in the REST v2 reference. No OpenAPI operation in this repo answers natural
    language questions over an account's conversations.
- tool: ask_deal
  reason: >-
    Same ask-entity backing API, scoped to an opportunity. The nearest REST
    relatives (listCallsExtensive, getCallTranscripts) return raw call records,
    not an answer, so this is a genuine capability divergence rather than a
    naming difference.
- tool: generate_brief
  reason: >-
    Backed by the get-brief API. No REST operation produces a sectioned brief;
    retrieveAggregatedActivity and retrieveAnsweredScorecards are statistical
    rollups, not narrative summaries.
