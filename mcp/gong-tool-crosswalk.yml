    base: https://api.gong.io/v2
    gated: >-
      The spec files are public in this repo, but the interactive reference at
      app.gong.io/settings/api/documentation requires a Gong login, and the API
      host itself answers 401 to every anonymous request.
  mcp:
    url: https://mcp.gong.io/mcp
