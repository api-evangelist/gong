  backing_api: get-brief API
  consumes_credits: true
  source: https://help.gong.io/docs/how-mcp-server-tools-and-apis-consume-credits
tools_note: >-
  This tool list is taken verbatim from Gong's own credit-consumption
  documentation, which is the only place Gong names its MCP tools. A live
  tools/list probe against https://mcp.gong.io/mcp returned HTTP 401 with
  `WWW-Authenticate: Bearer realm="mcp"`, so the authoritative tool set and the
  per-tool inputSchema require an authenticated introspection. The list above
  may therefore be incomplete and carries no input schemas. Gong's docs also
  describe the server's capability envelope as: ask questions about accounts and
  deals, generate summaries, and retrieve AI-generated insights.
mcp_client:
  note: >-
    Gong also ships an MCP CLIENT — Gong AI agents (e.g. AI Briefer) can connect
    outward to external MCP servers configured by a business admin. That is a
    consumption surface, not a surface an external agent can call, and is
    recorded here only for completeness.
