  registration: >-
    No dynamic client registration. A Gong tech admin registers an "MCP
    integration" in Admin center > Settings > Ecosystem > API, chooses Personal
    access (per-user data, the default, recommended for Claude/ChatGPT/Copilot)
    or Shared access (whole-organization data, for backend agents), supplies the
    client's redirect URI, and receives a client ID and client secret. The
    authorization context cannot be changed after submission.
access_control:
  seat_required: paid Gong seat; Collaborators cannot use the MCP server
  admin_role: Tech admin
  metering: >-
    MCP tool calls consume Gong credits on the same model as the equivalent
    REST call — consumption tracks the volume of calls and emails analyzed, not
    the access method.
