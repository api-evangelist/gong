note: >-
  Gong publishes exactly one first-party client library: the browser-side
  frontend SDK used by iframe apps embedded in the Gong email composer and
  account/pipeline pages. It is published under the npm scope @gong.io, which
  Gong controls, and is the package Gong's own help docs tell partners to
  import. There is NO first-party server-side SDK for the REST API in any
  language — npm, PyPI, RubyGems, Maven Central, NuGet, crates.io and
  pkg.go.dev were all checked and the only Gong-named packages are
  community/third-party wrappers and MCP servers. The github.com/gong-io
  organization publishes research and annotation tooling (gecko, doccano,
  call-playbook), not API clients.
