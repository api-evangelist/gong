- aid: gong:gong-accounts-enrich-api
  name: Gong Accounts Enrich API
  description: >-
    <h3>Gong’s “Accounts Enrich” API endpoints allow you to enrich your account records with Gong's data.</h3>

    <p>Enrichment is asynchronous and works in two steps:</p>

    <ol>

    <li>

    Submit up to 10 accounts, along with the data categories you want, and receive a <b>jobId</b>.

    </li>

    <li>

    Retrieve the results using the <b>jobId</b>. A data category whose status is “Running” is still being
    enriched, so poll until no category is “Running”.

    </li>

    </ol>

    <p>

    Each account is identified by search criteria - its name, domain or LinkedIn URL - and is returned
    with the id you supplied, so you can correlate results with your request.

    </p>
  humanURL: https://app.gong.io/settings/api/documentation
  baseURL: https://api.gong.io/v2
  tags:
  - Accounts Enrich
  properties:
  - type: OpenAPI
    url: openapi/gong-accounts-enrich-api-openapi.yml
