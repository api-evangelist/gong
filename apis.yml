- aid: gong:gong-contacts-enrich-api
  name: Gong Contacts Enrich API
  description: >-
    <h3>Gong’s “Contacts Enrich” API endpoints allow you to enrich your contact records with Gong's data.</h3>

    <p>Enrichment is asynchronous and works in two steps:</p>

    <ol>

    <li>

    Submit up to 10 contacts, along with the data categories you want, and receive a <b>jobId</b>.

    </li>

    <li>

    Retrieve the results using the <b>jobId</b>. A data category whose status is “Running” is still being
    enriched, so poll until no category is “Running”.

    </li>

    </ol>

    <h3>Each contact must be identified by one of the following combinations:</h3>

    <ul>

    <li>

    <b>linkedinUrl</b> on its own

    </li>

    <li>

    <b>firstName</b> + <b>lastName</b> + <b>email</b>

    </li>

    <li>

    <b>firstName</b> + <b>lastName</b> + <b>accountSearchCriteria</b> (the account's name, domain or LinkedIn
    URL)

    </li>

    </ul>

    <p>

    Each contact is returned with the id you supplied, so you can correlate results with your request.

    </p>
  humanURL: https://app.gong.io/settings/api/documentation
  baseURL: https://api.gong.io/v2
  tags:
  - Contacts Enrich
  properties:
  - type: OpenAPI
    url: openapi/gong-contacts-enrich-api-openapi.yml
- aid: gong:gong-crm-api
  name: Gong CRM API
  description: >-
    <style>.public-api-info {    background: rgb(222, 235, 255);}.public-api-tip {    background: rgb(227,
    252, 239);}.public-api-parameter {    background: rgba(9,30,66,0.08);}.public-api-note {    background:
    rgb(234, 230, 255);}.public-api-important {    background: rgb(255, 250, 230);}.public-api-critical
    {    background: rgb(255, 235, 230);}table, th, td {  border: 1px solid gray;  border-collapse: collapse;}th,
    td {  padding: 5px;}th {  text-align: left;}img {  border: 2px solid #D3D5D9;}</style><p>If you are
    using the deprecated endpoints, download the <a href="/r/img/permanent/crm_api_deprecated_endpoints.pdf"
    target="_blank">PDF file</a>.</p><h1>What does the CRM API do?</h1><p>This API enables integration
    with CRMs that are not natively integrated with Gong, so that Gong can provide you with its full capabilities
    based on your CRM data. This includes:</p><ul>  <li>Pipeline review and forecast</li>  <li>Narrow
    down conversations (calls and emails) by customer data for coaching and analytics</li>  <li>Track
    initiatives and adoption based on accounts and opportunities</li></ul><p>By uploading your CRM data
    to Gong, your Gong users will be able to see their CRM deals in the Gong Deals page, view deal boards
    to follow up on deal progress, get warnings for deals that are at risk, and see whether their team
    will reach its quota. The CRM data is also displayed in conversations and calls, so that your Gong
    users can see account and contact data such as the name and job title of the contact in the call.
    Account data is displayed in the Accounts page, together with the history of all communication and
    contact with the company.</p><p><b>Note</b>: Gong provides native integrations with Salesforce, HubSpot
    and Microsoft Dynamics 365.</p><h2>API Protocol</h2>The API protocol is based on REST guidelines.
    Check <a href="https://app.gong.io/company/api-authentication?currentTab=MY_API_TAB">here</a> what's
    your base URL for all API calls.

    <p>The payload is either a JSON object or, for API calls that upload lists of objects, line delimited
    JSON (see: <a href="https://en.wikipedia.org/wiki/JSON_streaming#Newline-Delimited_JSON">JSON streaming</a>).
    JSON objects should be UTF-8 encoded.</p><p>Dates and timestamps in JSON objects should be in ISO-8601
    format without milliseconds (e.g. '2018-02-18T02:30:00-07:00' or '2018-02-18T08:00:00Z', where Z stands
    for UTC).</p><h2>What data can I upload?</h2><p>To see your CRM data in Gong, upload the following
    entities:</p><ul>  <li>Business User: The CRM user, such as a seller or manager. </li>  <li>Account:
    The customer details in the CRM</li>  <li>Contact: A specific contact in the CRM that is associated
    with a customer</li>  <li>Deal: A deal or opportunity, or a contract of a specific account in the
    CRM</li>  <li>Lead: A potential customers who are not associated with an account</li>  <li>Stage:
    The list of stages the deal can be in, in your CRM</li></ul><h2>Uploading CRM data to Gong</h2><p>This
    diagram shows how to set up your system in order to upload CRM data to Gong. This is relevant for
    each scenario of uploading data, initial, incremental and uploading historical data.</p><img alt=""
    src="/r/img/permanent/crm_api_flow.png" height="95%" ><h3>Registering your Integration</h3><p>Register
    your integration to get an integrationId used to identify your company's integration with Gong. This
    is a one time action that does not need to be repeated unless you delete your integration.</p><p>Use
    <code>PUT v2/crm/integrations</code> to register your integration. The integration Id is returned
    in the response. Include the integration Id each time you upload your CRM data.</p><h3>Uploading additional
    data for CRM entities</h3><p>Each CRM entity has a set of standard fields. In addition, you may want
    to upload additional fields.</p><p>Use the <code>POST /v2/crm/entity-schema</code> to adjust the schema
    according to your needs. Once you have uploaded your schema to Gong, you can upload your entities
    with the additional fields.</p><h3>Uploading your CRM data to Gong</h3><p>This section explains how
    you can use the CRM API to upload your data to Gong:</p><h4>First-time upload</h4><p>Create a database
    dump of the data you want to upload to Gong based on your CRM schema and data. When uploading your
    data for the first time you should include all of the CRM records that should appear in Gong.</p><h4>Incremental
    upload </h4><p>Send regular incremental data updates to Gong. You can update your data as often as
    you like, we recommend updating between every 1-5 minutes.<br>You should only send new records or
    records that have changed since the previous upload of data. New records are added to Gong and existing
    records are updated or deleted, whichever is relevant. Entities are identified by the objectId. Ensure
    that this ID remains the same each time it is updated.</p><p>When updating data, the modificationDate
    parameter is mandatory. This enables us to maintain accurate historical data. If your CRM does not
    store the modification date, send the date the API call is made.</p><h4>Uploading data change history</h4><p>Gong
    incorporates historical change data in different areas of Gong in order to provide a more accurate
    picture of the status of different entities at that time. For example, showing the correct stage of
    a deal at the time a call was made.</p><p>If your CRM stores record history, you are encouraged to
    load historical change data as part of the integration. You can do this at any time, but we recommend
    doing this after the initial upload as follows:</p><ol>  <li>Generate the JSON files with the relevant
    data. Ensure that the modifiedDate is set to the date the entity was updated.</li>  <li>Upload the
    entities with their historical data using the <code>POST /v2/crm/entities?objectType=ACCOUNT|CONTACT|DEAL|LEAD</code>
    endpoint.</li></ol><h2>Gong Data Model</h2><p>This diagram shows the connection between the different
    objects in the CRM API:</p><img alt="" src="/r/img/permanent/crm_api_model.png" height="80%"><p>The
    following relationship between entities must exist:</p><ul>  <li>A contact must be linked to a single
    account.</li>  <li>A deal is linked to a single account.</li>  <li>A deal has an owner who is a user
    in Gong.</li>  <li>A converted lead is expected to be converted into an account and/or a deal and/or
    a contact.</li></ul><h2>What if my CRM doesn't match the Gong data model?</h2><p>It is possible that
    your CRM entity model won't match the Gong CRM entity model. Your CRM may store your data in different
    entities, or you may not have an entity that represents one of the Gong CRM entities.</p><p>In order
    to upload your CRM data and associate it with calls and conversations, you need to identify the objects
    in your CRM which match the Gong CRM entities.</p><p>The account is a mandatory entity which must
    be uploaded in order to integrate Gong with your CRM. To upload account data, identify your CRM entities
    that contain data about your customers or companies that you do business with. These customers are
    not actual people within the org, rather they represent the org itself.</p><p>To upload contact details,
    identify your CRM entities that hold data about employees in the company that your reps are in touch
    with. A contact represents a person where communication has advanced beyond the prospect stage. Your
    reps will have multiple conversations and interactions with the contact.</p><p>The deal represents
    the selling process to the customer (account).</p><p>The lead is a prospect or potential contact,
    who is not yet associated with an account. If your CRM has an entity which represents people who you
    contact in the very early stages, and who is later converted to another entity which represents the
    people you are doing business with (the contact), upload this data as a lead entity.</p><h2>When will
    my CRM data be displayed in Gong?</h2><p>In addition to the time it takes for data to upload to Gong,
    the data is first uploaded as raw data and is not automatically available in Gong.</p><br><br><br><br>
  humanURL: https://app.gong.io/settings/api/documentation
