- aid: gong:gong-engagement-legacy-see-digital-interactions-api
  name: Gong Engagement (Legacy – See “Digital Interactions”) API
  description: >-
    <h3>Limited release - contact <a href="mailto:integration.requests@gong.io">integration.requests@gong.io</a>
    for more information.

    </h3>


    <h3>Gong’s "Engagement" API endpoints allow you to push engagement events into Gong and display them
    as events in Gong’s activity timeline.</h3>

    <h3>There are currently 3 types of events:</h3>

    <ul>

    <li>

    "Content Shared" Event Type - Use this event type to push engagement events into Gong when a Gong
    user shares content with external participants (for example, a contract was “shared” by the account
    executive with his prospects)</li>

    <li>

    "Content Viewed" Event Type - Use this event type to push engagement events into Gong when a content
    is viewed by an external participant (for example, a contract was “viewed” by the prospect)

    </li>

    <li>

    "Custom Action" Event Type -  Use this event type to push engagement events into Gong when a content
    is engaged by an external participant (for example, a contract was “signed” by the prospect)</li>

    </ul>
  humanURL: https://app.gong.io/settings/api/documentation
  baseURL: https://api.gong.io/v2
