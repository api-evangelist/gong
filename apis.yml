name: Gong
kind: company
description: Gong is the revenue intelligence platform that captures and analyzes customer
  interactions across calls, emails, meetings and web conferencing, then applies AI to surface
  deal risk, coaching signal and forecast correction for B2B go-to-market teams. Its public REST
  v2 API at api.gong.io exposes 57 operations covering calls, transcripts, recordings, users,
  permission profiles, workspaces, statistics, scorecards, trackers, library content, Engage
  flows and prospects, engagement events, meetings, audit logs, generic CRM ingestion and
  GDPR/CCPA data-privacy erasure. Gong also runs an official remote MCP server at mcp.gong.io
  for external AI agents, a rule-driven outbound webhook surface for calls, and a frontend SDK
  for partner apps embedded in the Gong UI.
