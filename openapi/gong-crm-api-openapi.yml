    post:
      tags:
      - CRM
      summary: Upload Object Schema (/v2/crm/entity-schema)
      description: '.public-api-info { background: rgb(222, 235, 255);}.public-api-tip { background: rgb(227, 252, 239);}.public-api-parameter { background: rgba(9,30,66,0.08);}.public-api-note { background: rgb(234, 230, 255);}.public-api-important { background: rgb(255, 250, 230);}.public-api-critical { background: rgb(255, 235, 230);}table, th, td { border: 1px solid gray; border-collapse: collapse;}th, td { padding: 5px;}th { text-align: left;}img { border: 2px solid #D3D5D9;}

        Enables you to add, edit or remove fields to Gong CRM entities, so that you can display additional CRM data in Gong. Fields that are not included in the Gong CRM objects, and are uploaded without updating your schema, are not displayed in Gong.


        Update your schema when:


        You create a new integration


        There are changes to the schema of any object type. You can also send a schema update request before any request to the /v2/crm/entities API.


        When updating your schema:


        Add or change field: include all fields you want in the schema, including those sent previously. Example:


        Date Action Result


        3/4/2023 Send account schema with fieldA fieldA added to the account


        6/4/23 Send account schema with fieldA and fieldB fieldA still included in account schema. fieldB added to the account


        8/4/23 Send account schema with fieldC but without fieldA and fieldB Receive an error that you must include all fields in the schema


        15/4/23 Send account schema with fieldB, fieldC, and isDeleted for fieldA fieldA and all it''s data are deleted. fieldB and fieldC remain in the schema


        Changing a field: if you change the field type, a new field is created and the data associated with the original field is deleted. Other changes, such as the label do not result in data being deleted.


        Deleting a field: to delete a field and it''s associated data, send the field with isDeleted = true


        When accessed using a bearer token, this endpoint requires the ''api:crm:schema'' scope.


        Supported field types


        This table describes the field types that can be added to your schema


        Field typeFormat in JSONPossible values


        BOOLEANbooleantrue, false


        DATEstring (ISO-8601 date without time)"2020-05-31"


        DATETIMEstring (ISO-8601 datetime without milliseconds)"2020-12-17T07:37:21+02:00"

        "2020-12-17T05:37:21Z"


        PICKLISTstring - one of the values in an orderedValueList"Analyst"


        NUMBERnumber45.66, 8453


        PERCENTnumber (between 0 to 100)67.3


        CURRENCY*number34.68


        PHONENUMBERstring"+14055766687"


        EMAILADDRESSstring"john.doe@anywhere.com"


        REFERENCEstring - the id of another object"48b009drax"


        IDstring - the id of the object"843hf8484jr84htg"


        STRINGstring"whatever you want"


        URLstring"https://crm.com/account/6d4r578f"


        * In the integration send a number value, and specify the correct currency symbol in the Gong UI. Currently Gong does not support multiple currencies per company.


        Example


        Request


        POST https://api.gong.io/v2/crm/entity-schema?integrationId=6286478263646&objectType=ACCOUNT


        [{"uniqueName": "orderId", "label": "ID", "type": "ID", "lastModified": "2020-11-11T08:11:34+01:00"},


        {"uniqueName": "parentAccount", "label": "Main Account", "type": "REFERENCE", "referenceTo": "ACCOUNT", "lastModified": "2020-11-11T08:11:34+01:00"},


        {"uniqueName": "category", "label": "Category", "type": "PICKLIST", "orderedValueList": ["Analyst", "Competitor", "Customer", "Integrator", "Investor", "Partner", "Other"], "lastModified": "2020-11-11T08:11:34+01:00"},


        // remove custom field


        {"uniqueName": "industry", "isDeleted": true, "label": "Industry", "type": "PICKLIST", "lastModified": "2020-11-21T08:11:34+01:00"}]'
      operationId: uploadCrmSchemaField
      parameters:
      - name: integrationId
        in: query
        description: Integration ID generated when creating the integration
        required: true
        style: FORM
        explode: true
        schema:
          type: integer
          format: int64
          exampleSetFlag: false
          types:
          - integer
      - name: objectType
        in: query
        description: The object type to set the schema for (case-sensitive)
        required: true
        style: FORM
        explode: true
        schema:
          type: string
          exampleSetFlag: false
          types:
          - string
          enum:
          - ACCOUNT
          - CONTACT
          - DEAL
          - LEAD
      requestBody:
        content:
          application/json:
            schema:
              type: array
              exampleSetFlag: false
              items:
                $ref: '#/components/schemas/GenericSchemaFieldRequest'
                exampleSetFlag: false
              types:
              - array
            exampleSetFlag: false
        required: true
      responses:
        '201':
          description: Successfully uploaded crm schema fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaUpdateResponse'
                exampleSetFlag: false
              exampleSetFlag: false
        '400':
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
              exampleSetFlag: false
        '401':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
              exampleSetFlag: false
        '429':
          description: API request limit exceeded
          headers:
            Retry-After:
              description: Number of seconds to wait before making a new request.
              style: SIMPLE
              explode: false
              schema:
                type: integer
                format: int32
                exampleSetFlag: false
                types:
                - integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
              exampleSetFlag: false
        '500':
          description: Failed to complete the operation due to an unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
              exampleSetFlag: false
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
                exampleSetFlag: false
              exampleSetFlag: false
  /v2/crm/entities:
    get:
      tags:
      - CRM
      summary: Get CRM objects (/v2/crm/entities)
      description: '.public-api-info { background: rgb(222, 235, 255);}.public-api-tip { background: rgb(227, 252, 239);}.public-api-parameter { background: rgba(9,30,66,0.08);}.public-api-note { background: rgb(234, 230, 255);}.public-api-important { background: rgb(255, 250, 230);}.public-api-critical { background: rgb(255, 235, 230);}table, th, td { border: 1px solid gray; border-collapse: collapse;}th, td { padding: 5px;}th { text-align: left;}img { border: 2px solid #D3D5D9;}

        This API is for use in the development phase only, to manually verify that objects are uploaded and processed correctly in Gong.


        Returns a JSON object where each key is the object’s crm id and the corresponding value is a nested JSON object representing the CRM object fields. Each key in the nested JSON is the field name and the corresponding value is the field value.


        The objects are fetched from the Gong main DB. If the object is not found, the JSON’s value is null.


        The request body contains an array of objects ids.


        The request is limited to 100 objects. If more than 100 objects are requested only the first 100 are returned.


        When accessed using a bearer token, this endpoint requires the ''api:crm:get-objects'' scope.


        Example


        Request

        GET https://api.gong.io/v2/crm/entities?integrationId=6286478263646&objectType=DEAL


        ["1234","8765"] //request body'
      operationId: getCrmObjects
      parameters:
      - name: integrationId
        in: query
        description: Integration ID generated when creating the integration
        required: true
        style: FORM
        explode: true
        schema:
          type: integer
          format: int64
          exampleSetFlag: false
          types:
          - integer
      - name: objectType
        in: query
        description: Requested objects type
        required: true
        style: FORM
        explode: true
        schema:
          type: string
          exampleSetFlag: false
          types:
          - string
          enum:
          - ACCOUNT
          - CONTACT
          - DEAL
          - LEAD
      - name: objectsCrmIds
        in: query
        description: <b>Request Body:</b> The requested objects crm ids (should be sent in the request body)
        required: true
        style: FORM
        explode: true
        schema:
          uniqueItems: true
          type: array
          exampleSetFlag: false
          items:
            type: string
            exampleSetFlag: false
            types:
            - string
          types:
          - array
      responses:
        '200':
          description: Successfully retrieved requested objects data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetGenericCrmObjectsResponse'
                exampleSetFlag: false
              exampleSetFlag: false
        '400':
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
              exampleSetFlag: false
        '401':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
              exampleSetFlag: false
        '429':
          description: API request limit exceeded
          headers:
            Retry-After:
              description: Number of seconds to wait before making a new request.
              style: SIMPLE
              explode: false
              schema:
                type: integer
                format: int32
                exampleSetFlag: false
                types:
                - integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
              exampleSetFlag: false
        '500':
          description: Failed to complete the operation due to an unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
              exampleSetFlag: false
    post:
      tags:
      - CRM
      summary: Upload CRM objects (/v2/crm/entities)
      description: '.public-api-info { background: rgb(222, 235, 255);}.public-api-tip { background: rgb(227, 252, 239);}.public-api-parameter { background: rgba(9,30,66,0.08);}.public-api-note { background: rgb(234, 230, 255);}.public-api-important { background: rgb(255, 250, 230);}.public-api-critical { background: rgb(255, 235, 230);}table, th, td { border: 1px solid gray; border-collapse: collapse;}th, td { padding: 5px;}th { text-align: left;}img { border: 2px solid #D3D5D9;}

        Inserts, updates, or deletes a CRM entity in Gong. Gong searches for existing entities with the same ID, to determine whether the entity should be added or updated. Ensure you have an authentication key and that you have registered your integration before uploading your CRM data. When accessed using a bearer token, this endpoint requires the ''api:crm:upload'' scope. Request parameters


        Query String parameters


        Mandatory parameters are marked with a *. Name Description Data Type


        integrationId * Integration ID generated when creating the integration long


        objectType * The object being uploaded. Options are (case-sensitive):


        ACCOUNT


        CONTACT


        DEAL


        LEAD


        BUSINESS_USER


        STAGE


        string


        clientRequestId * A unique identifier sent by you to allow troubleshooting and to prevent repeated attempts to upload the same list of objects. Valid characters: letters, numbers, dashes and underscores. string


        Request Body


        Content-Type should be multipart/form-data


        Maximum payload size: 200 megabytes


        Name Description Data Type


        dataFile * The LDJSON file with the entity data to upload. A file should only contain objects of one entity type. Records that have multiple updates should be sent in separate files. Each JSON object should be on a separate line. file


        CRM Entities


        This section details the entities that can be uploaded to Gong


        Business User


        The CRM business user represents the Gong user in the CRM and is responsible for the relationship with the account and for creating opportunities and closing deals. Uploading business users enables Gong to associate CRM entities such as accounts and contacts with the relevant user in Gong and with their Gong activity, such as conversations. Mandatory parameters are marked with a *. To upload your business users to Gong, generate a JSON file with the following fields:


        Name Description Data Type


        objectId * The CRM unique ID for the object. Note: objectId can have a maximum of 64 characters and can have the following characters:


        alpha numeric characters and a "-"


        a valid email address


        No other special characters can be used string


        modifiedDate * The date and time the object was last modified in the CRM ISO-8601 datetime format, without milliseconds


        isDeleted (Default: false) When true, the object is deleted from the database. boolean


        url The full URL path to view this object in the CRM string (Qualified URI)


        emailAddress * The business user''s email address. Used to associate the Gong user with the CRM user. Not mandatory when isDeleted = true. string


        Associating the Gong user with the CRM user


        The CRM user is associated with the Gong user according to the email address. Each CRM deal contains an ownerId field, which is the CRM user ID. To update an existing user:


        Delete the existing user by uploading the business user entity with isDeleted=true. In a new request, send the new user details with isDeleted=false, or send a different user with the same email address. Account


        The account object is an active customer in the CRM. Emails and calls in Gong are associated with this account object. Mandatory parameters are marked with a *. To upload your CRM accounts to Gong, generate a JSON file with the following fields:


        Name Description Data Type


        objectId * The CRM unique ID for the object.'
      operationId: uploadCrmData
      requestBody:
        content:
          multipart/form-data:
            schema:
              required:
              - dataFile
              type: object
              properties:
                dataFile:
                  type: string
                  description: The CRM data file. You may attach files up to 200MB in size
                  format: binary
                  exampleSetFlag: false
                  types:
                  - string
              exampleSetFlag: false
              types:
              - object
            exampleSetFlag: false
        required: true
      responses:
        '201':
          description: 'Successfully uploaded the crm data.<br>Important: This API is asynchronous. A 201 response indicates that the file successfully uploaded to Gong and is pending processing. Use the clientRequestId to verify the status of the request by calling the GET /v2/crm/request-status endpoint.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncProcessingResponse'
                exampleSetFlag: false
              exampleSetFlag: false
        '400':
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
              exampleSetFlag: false
        '401':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
              exampleSetFlag: false
        '409':
          description: Client request id has already been used
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
              exampleSetFlag: false
        '429':
          description: API request limit exceeded
          headers:
            Retry-After:
              description: Number of seconds to wait before making a new request.
              style: SIMPLE
              explode: false
              schema:
                type: integer
                format: int32
                exampleSetFlag: false
                types:
                - integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
              exampleSetFlag: false
        '500':
          description: Failed to complete the operation due to an unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
              exampleSetFlag: false
  /v2/crm/request-status:
    get:
      tags:
      - CRM
      summary: Get Request Status (/v2/crm/request-status)
      description: '.public-api-info { background: rgb(222, 235, 255);}.public-api-tip { background: rgb(227, 252, 239);}.public-api-parameter { background: rgba(9,30,66,0.08);}.public-api-note { background: rgb(234, 230, 255);}.public-api-important { background: rgb(255, 250, 230);}.public-api-critical { background: rgb(255, 235, 230);}table, th, td { border: 1px solid gray; border-collapse: collapse;}th, td { padding: 5px;}th { text-align: left;}img { border: 2px solid #D3D5D9;}

        Returns the current status of the request for endpoints run asynchronously:


        POST /v2/crm/entities


        DELETE /v2/crm/integrations


        When accessed using a bearer token, this endpoint requires the ''api:crm:upload'' scope.


        Status Codes


        PENDING: file is pending being processed


        IN_PROGRESS: file is being processed


        DONE: all objects in the file were successfully processed


        FAILED: failed to parse some objects, or a general error occurred when the file was being processed


        Correcting a file that failed to be processed:


        When the status in the response is FAILED do one of the following:


        If the response includes a list of errors, correct the errors in the file as follows:


        Using the errors.line attribute, locate and correct the data in the JSON file.


        You can resend the entire LDJSON file, or only the corrected records via the relevant API.

        Note: The response returns a maximum of 20 errors. To make sure you have corrected all errors, upload the entire file repeatedly until you receive a DONE status.


        A single error in the form of:

        {"line":0,"description":"....."} indicates a general processing error:


        Fix the LDJSON file according to the error message.


        Upload the entire LDJSON file again.'
      operationId: getRequestStatus
      parameters:
      - name: integrationId
        in: query
        description: Integration ID generated when creating the integration
        required: true
        style: FORM
        explode: true
        schema:
          type: integer
          format: int64
          exampleSetFlag: false
          types:
          - integer
      - name: clientRequestId
        in: query
        description: The client request ID used in the asynchronous endpoint you want to get a status for
        required: true
        style: FORM
        explode: true
        schema:
          type: string
          exampleSetFlag: false
          types:
          - string
      responses:
        '200':
          description: Operation successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestStatusResponse'
                exampleSetFlag: false
              exampleSetFlag: false
        '400':
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
              exampleSetFlag: false
        '401':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
              exampleSetFlag: false
        '429':
          description: API request limit exceeded
          headers:
            Retry-After:
              description: Number of seconds to wait before making a new request.
              style: SIMPLE
              explode: false
              schema:
                type: integer
                format: int32
                exampleSetFlag: false
                types:
                - integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
              exampleSetFlag: false
        '500':
          description: Failed to complete the operation due to an unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
