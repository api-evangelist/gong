  /v2/stats/activity/aggregate-by-period:
    post:
      tags:
      - Stats
      summary: Retrieve aggregated activity for defined users by a date range with grouping in…
      description: 'Returns aggregated statistics for team members’ actions on calls in Gong, grouped by the specified time period (aggregationPeriod).

        Each record shows the total number of activities performed within the fromDate–toDate range. If the same activity occurs in different periods, it’s counted separately. For example, if a team member listens to the same call on two different days, each day counts as one; listening to the same call twice on the same day counts as a single activity.

        Use the userIds field to retrieve data for specific team members. If userIds is empty, only team members with activity in the specified date range are returned.


        When accessed through a Bearer token authorization method, this endpoint requires the scope ''api:stats:user-actions''.'
      operationId: listMultipleUsersAggregateByPeriod
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestWithTimePeriod'
              exampleSetFlag: false
            exampleSetFlag: false
