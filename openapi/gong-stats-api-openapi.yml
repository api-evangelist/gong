openapi: 3.2.0
info:
  title: Gong Stats API
  description: 'Overview


    The Gong API allows you to:


    Receive the following information from Gong:


    Your company''s calls in Gong


    Your company''s users in Gong


    Your company''s user stats in Gong


    Your company''s user settings in Gong


    Your company''s libraries in Gong


    Upload new or

    update

    call recordings in Gong, in order to support cases where you have an internal system that records

    calls or obtains them from a third-party entity.


    Data Privacy:

    Delete users and all their associated elements.


    Upload CRM data into Gong.


    Check here what''s your base URL for all API calls.


    Authentication


    There are two ways to retrieve credentials to the Gong Public API:


    Retrieve Manually:


    In the Gong API Page (you

    must be a technical administrator in Gong), click "Create" to receive an Access Key

    and an Access Key Secret.


    Use the Basic Authorization HTTP header (as per RFC)

    to access the Public API as shown below:


    Authorization: Basic <token>


    To create the basic token, combine the Access Key and the Access Key Secret with

    colon (:) and then encode in Base64 as following:


    Base64(<accessKey> : <accessKeySecret>)


    Retrieve through OAuth


    To obtain the Bearer token, follow the steps described in the Gong OAuth Guide.


    After obtaining the token, use the Bearer Authorization HTTP header

    (as per RFC)

    to access the Public API as shown below:


    Authorization: Bearer <token>


    Limits


    By default Gong limits your company''s access to the service to 3 API calls per second, and 10,000 API calls per day.


    When the rate of API calls exceeds these limits an HTTP status code 429 is returned and a Retry-After header indicates

    how many seconds to wait before making a new request.


    If required, contact help.gong.io to change these limits.


    Cursors


    Some API calls that return a list are limited in the amount of records they may return, so multiple API calls may be

    required to bring all records. Such an API call also returns a records field, which contains the number of records

    in the current page, the current page number and the total number of records.


    In cases where the total number of records exceeds the number of records thus far retrieved, the records field will also

    contain a cursor field which can be used to access the next page of records. To retrieve the next page, repeat the API call with

    the cursor value as supplied by the previous API call. All other request inputs should remain the same.


    Forward Compatibility


    When coding a system to accept Gong data, take into account that Gong may, without prior warning, add fields to the JSON output.

    It is recommended to future proof your code so that it disregards all JSON fields you don''t actually use.'
  version: V2
servers:
- url: https://127.0.0.1:8443
  description: Generated server url
tags:
- name: Stats
  description: 'Gong’s “Stats” API endpoints allow you to:


    Request user activity


    Request scorecards activity


    Request interaction stats on calls that have Whisper turned on


    The requested user activity may contain the following details:


    Calls Hosted: The number of recorded calls this user hosted.


    Call Participated: The number of calls in which this user is a participant (not host).


    Calls Reviewed: The number of calls in which someone pressed the "Mark as reviewed".


    Calls Listened: The number of other users'' calls the user listened to.


    Call Shared Outside: The number of calls the user shared with others outside the company.


    Call Shared Inside: The number of calls the user shared with others inside the company.


    Own Calls Listened: The number of the user''s own calls the user listened to.


    Comment Given: The number of calls in which a user gave at least one comment.


    Comment Received: The number of calls in which a user received at least one comment on the users calls.


    Feedback Given: The number of recorded calls the user gave feedback on.


    Feedback Received: The number of recorded calls the user received feedback on.


    Feedback Requested: The number of recorded calls the user requested feedback on.


    Scorecard Filled: The number of calls in which someone filled a scorecard on the user''s calls.


    Scorecards Completed: The number of scorecards the user completed.


    Scorecards Answers: The answers in the answered scorecard.


    Whisper: Person Interaction Stats (List of user interaction stats. Applicable values: ''Talk Ratio'',

    ''Longest Monologue'', ''Longest Customer Story'', ''Interactivity'', ''Question Rate'', ''Patience'').'
paths:
  /v2/stats/interaction:
    post:
      tags:
      - Stats
      summary: Retrieve interaction stats for applicable users by date (/v2/stats/interaction)
      description: 'Returns interaction stats for users based on calls that have Whisper turned on.


        When accessed through a Bearer token authorization method, this endpoint requires the scope ''api:stats:interaction''.'
      operationId: listInteractionStats
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicApiBaseRequestV2MultipleUsersWithDates'
              exampleSetFlag: false
            exampleSetFlag: false
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyUsersIntercationStatsResponse'
                exampleSetFlag: false
              exampleSetFlag: false
        '400':
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
              exampleSetFlag: false
        '401':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
              exampleSetFlag: false
        '404':
          description: No stats found for the specified period
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
              exampleSetFlag: false
        '429':
          description: API request limit exceeded
          headers:
            Retry-After:
              description: Number of seconds to wait before making a new request.
              style: SIMPLE
              explode: false
              schema:
                type: integer
                format: int32
                exampleSetFlag: false
                types:
                - integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
              exampleSetFlag: false
        '500':
          description: Failed to complete the operation due to an unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
              exampleSetFlag: false
