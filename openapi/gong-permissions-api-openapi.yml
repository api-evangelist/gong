openapi: 3.2.0
info:
  title: Gong Permissions API
  description: 'Overview


    The Gong API allows you to:


    Receive the following information from Gong:


    Your company''s calls in Gong


    Your company''s users in Gong


    Your company''s user stats in Gong


    Your company''s user settings in Gong


    Your company''s libraries in Gong


    Upload new or

    update

    call recordings in Gong, in order to support cases where you have an internal system that records

    calls or obtains them from a third-party entity.


    Data Privacy:

    Delete users and all their associated elements.


    Upload CRM data into Gong.


    Check here what''s your base URL for all API calls.


    Authentication


    There are two ways to retrieve credentials to the Gong Public API:


    Retrieve Manually:


    In the Gong API Page (you

    must be a technical administrator in Gong), click "Create" to receive an Access Key

    and an Access Key Secret.


    Use the Basic Authorization HTTP header (as per RFC)

    to access the Public API as shown below:


    Authorization: Basic <token>


    To create the basic token, combine the Access Key and the Access Key Secret with

    colon (:) and then encode in Base64 as following:


    Base64(<accessKey> : <accessKeySecret>)


    Retrieve through OAuth


    To obtain the Bearer token, follow the steps described in the Gong OAuth Guide.


    After obtaining the token, use the Bearer Authorization HTTP header

    (as per RFC)

    to access the Public API as shown below:


    Authorization: Bearer <token>


    Limits


    By default Gong limits your company''s access to the service to 3 API calls per second, and 10,000 API calls per day.


    When the rate of API calls exceeds these limits an HTTP status code 429 is returned and a Retry-After header indicates

    how many seconds to wait before making a new request.


    If required, contact help.gong.io to change these limits.


    Cursors


    Some API calls that return a list are limited in the amount of records they may return, so multiple API calls may be

    required to bring all records. Such an API call also returns a records field, which contains the number of records

    in the current page, the current page number and the total number of records.


    In cases where the total number of records exceeds the number of records thus far retrieved, the records field will also

    contain a cursor field which can be used to access the next page of records. To retrieve the next page, repeat the API call with

    the cursor value as supplied by the previous API call. All other request inputs should remain the same.


    Forward Compatibility


    When coding a system to accept Gong data, take into account that Gong may, without prior warning, add fields to the JSON output.

    It is recommended to future proof your code so that it disregards all JSON fields you don''t actually use.'
  version: V2
servers:
- url: https://127.0.0.1:8443
  description: Generated server url
tags:
- name: Permissions
  description: 'Gong’s "Permission" API endpoints allow you to:


    List all permission profiles in a given workspace


    Create permission profile


    Get a permission profile


    Update permission profile


    List all users controlled by a permission profile


    Allow users individual access to calls


    Remove user''s individual access to calls


    Retrieve users that have individual access to calls'
paths:
  /v2/permission-profile:
    get:
      tags:
      - Permissions
      summary: Permission profile for a given profile Id (/v2/permission-profile)
      description: Returns a permission profile.
      operationId: getPermissionProfile
      parameters:
      - name: profileId
        in: query
        description: Permission profile identifier.
        required: true
        style: FORM
        explode: true
        schema:
          type: string
          exampleSetFlag: false
          types:
          - string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionProfileResponse'
                exampleSetFlag: false
              exampleSetFlag: false
        '400':
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
              exampleSetFlag: false
        '401':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
              exampleSetFlag: false
        '500':
          description: Failed to complete the operation due to an unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
              exampleSetFlag: false
    put:
      tags:
      - Permissions
      summary: Update permission profile (/v2/permission-profile)
      description: Update a permission profile.
      operationId: updatePermissionProfile
      parameters:
      - name: profileId
        in: query
        description: Permission profile identifier.
        required: true
        style: FORM
        explode: true
        schema:
          type: string
          exampleSetFlag: false
          types:
          - string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PermissionProfileDTO'
              exampleSetFlag: false
            exampleSetFlag: false
        required: true
      responses:
        '200':
          description: Successful response - returns the entire permission profile after applying the changes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionProfileResponse'
                exampleSetFlag: false
              exampleSetFlag: false
        '400':
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
              exampleSetFlag: false
        '401':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
              exampleSetFlag: false
        '500':
          description: Failed to complete the operation due to an unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
              exampleSetFlag: false
    post:
      tags:
      - Permissions
      summary: Create permission profile (/v2/permission-profile)
      description: Create a permission profile in a given workspace.
      operationId: createPermissionProfile
      parameters:
      - name: workspaceId
        in: query
        description: 'Workspace identifier.


          You can retrieve the workspace using the "workspaces" (under "Settings") API.'
        required: true
        style: FORM
        explode: true
        schema:
          type: string
          exampleSetFlag: false
          types:
          - string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PermissionProfileDTO'
              exampleSetFlag: false
            exampleSetFlag: false
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionProfileResponse'
                exampleSetFlag: false
              exampleSetFlag: false
        '400':
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
              exampleSetFlag: false
        '401':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
              exampleSetFlag: false
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
              exampleSetFlag: false
        '500':
          description: Failed to complete the operation due to an unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
              exampleSetFlag: false
  /v2/calls/users-access:
    put:
      tags:
      - Permissions
      summary: Give individual users access to calls (/v2/calls/users-access)
      description: 'Give individual users access to calls.


        If a user already has access (perhaps the call was shared with them, or they have access through their permission profiles) the request will have no effect.


        When accessed through a Bearer token authorization method, this endpoint requires the scope ''api:call-user-access:write''.'
      operationId: addUsersAccessToCalls
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CallsUsersAccessAddDto'
              exampleSetFlag: false
            exampleSetFlag: false
        required: true
      responses:
        '200':
          description: Successful request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
                exampleSetFlag: false
              exampleSetFlag: false
        '400':
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
              exampleSetFlag: false
        '401':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
              exampleSetFlag: false
        '500':
          description: Failed to complete the operation due to an unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
              exampleSetFlag: false
    post:
      tags:
      - Permissions
      summary: Retrieve users that have specific individual access to calls…
      description: 'Returns a list of users who have received individual access to calls through the API.


        This endpoint doesn''t cover user that have access for other reasons (such as sharing recipients, or access through permission profiles).


        When accessed through a Bearer token authorization method, this endpoint requires the scope ''api:call-user-access:read''.'
      operationId: getUsersAccessToCalls
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FilterRequestCallsAccessGetDto'
              exampleSetFlag: false
            exampleSetFlag: false
        required: true
      responses:
        '200':
          description: Successful request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallsAccessDetailsResponse'
                exampleSetFlag: false
              exampleSetFlag: false
        '400':
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
              exampleSetFlag: false
        '401':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
              exampleSetFlag: false
        '500':
          description: Failed to complete the operation due to an unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
              exampleSetFlag: false
    delete:
      tags:
      - Permissions
      summary: Remove specific individual users access from calls (/v2/calls/users-access)
      description: 'Remove individual user access from calls. The request can only remove access previously given by the /v2/calls/users-access API.


        If a given user does not have access to the call, they will be unaffected.


        If a given user does have access to the call, but not through the pubic API (for example if the call was shared with the user), the user''s access will remain unchanged.


        When accessed through a Bearer token authorization method, this endpoint requires the scope ''api:call-user-access:write''.'
      operationId: deleteUsersAccessToCalls
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CallsUsersAccessDeleteDto'
              exampleSetFlag: false
            exampleSetFlag: false
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
                exampleSetFlag: false
              exampleSetFlag: false
        '400':
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
              exampleSetFlag: false
        '401':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
              exampleSetFlag: false
        '500':
          description: Failed to complete the operation due to an unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
              exampleSetFlag: false
  /v2/permission-profile/users:
    get:
      tags:
      - Permissions
      summary: List all users attached to a given permission profile…
      description: 'Returns a list of all users whose access is controlled by the given permission profile.


        When accessed through a Bearer token authorization method, this endpoint requires the scope ''api:users:read''.'
      operationId: listPermissionProfileUsers
      parameters:
      - name: profileId
        in: query
        description: Permission profile identifier.
        required: true
        style: FORM
        explode: true
        schema:
          type: string
          exampleSetFlag: false
          types:
          - string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionProfileUsersResponse'
                exampleSetFlag: false
              exampleSetFlag: false
        '400':
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
              exampleSetFlag: false
        '401':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
              exampleSetFlag: false
        '500':
          description: Failed to complete the operation due to an unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
              exampleSetFlag: false
  /v2/all-permission-profiles:
    get:
      tags:
      - Permissions
      summary: List all company permission profiles for a given workspace…
      description: 'Returns a list of all permission profiles.


        The listing is in the alphabetical order of the profile names.'
      operationId: listPermissionProfile
      parameters:
      - name: workspaceId
        in: query
        description: 'Workspace identifier, the API will return only the profiles belonging to this workspace.


          You can retrieve the workspace using the "workspaces" (under "Settings") API.'
        required: true
        style: FORM
        explode: true
        schema:
          type: string
          exampleSetFlag: false
          types:
          - string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionProfilesResponse'
                exampleSetFlag: false
              exampleSetFlag: false
        '400':
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
              exampleSetFlag: false
        '401':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
              exampleSetFlag: false
        '500':
          description: Failed to complete the operation due to an unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
              exampleSetFlag: false
components:
  schemas:
    CallsUsersAccessDeleteDto:
      type: object
      properties:
        callAccessList:
          type: array
          description: A list, in which each item specifies a call and a list of users to be removed from the call.
          exampleSetFlag: false
          items:
            $ref: '#/components/schemas/CallUsersAccessDto'
            exampleSetFlag: false
          types:
          - array
      exampleSetFlag: false
      types:
      - object
    CallsUsersAccessAddDto:
      type: object
      properties:
        callAccessList:
          type: array
          description: A list, in which each item specifies a call and a list of users to be given access to this call.
          exampleSetFlag: false
          items:
            $ref: '#/components/schemas/CallUsersAccessDto'
            exampleSetFlag: false
          types:
          - array
      exampleSetFlag: false
      types:
      - object
    BaseResponse:
      type: object
      properties:
        requestId:
          type: string
          description: A Gong request reference Id, generated for this request. Can be used for troubleshooting purposes.
          example: 4al018gzaztcr8nbukw
          exampleSetFlag: true
          types:
          - string
      exampleSetFlag: false
      types:
      - object
    CallsAccessGetDto:
      required:
      - callIds
      type: object
      properties:
        callIds:
          uniqueItems: true
          type: array
          description: Array of Gong's unique numeric call IDs.
          example:
          - '7782342274025937895'
          exampleSetFlag: true
          items:
            type: string
            exampleSetFlag: false
            types:
            - string
          types:
          - array
      exampleSetFlag: false
      types:
      - object
    LibraryFolderAccess:
      type: object
      properties:
        permissionLevel:
          type: string
          description: Library folder permission level - mandatory value.
          exampleSetFlag: false
          types:
          - string
          enum:
          - none
          - all
          - specific-folders
          - none, all, specific-folders
        libraryFolderIds:
          uniqueItems: true
          type: array
          description: List of library folder Ids, if set, "permissionLevel" must not be "none".
          example:
          - '3843152912968920037'
          exampleSetFlag: true
          items:
            type: string
            description: List of library folder Ids, if set, "permissionLevel" must not be "none".
            example: '["3843152912968920037"]'
            exampleSetFlag: true
            types:
            - string
          types:
          - array
        managePublicFolder:
          type: boolean
          description: A user with this profile can manage public folder, if set, "permissionLevel" must not be "none".
          example: true
          exampleSetFlag: true
          types:
          - boolean
        manageStreams:
          type: boolean
          description: A user with this profile can manage streams, if set, "permissionLevel" must not be "none".
          example: true
          exampleSetFlag: true
          types:
          - boolean
        manageFolderCalls:
          type: boolean
          description: A user with this profile can add calls to folders, archive calls, if set, "permissionLevel" must not be "none".
          example: true
          exampleSetFlag: true
          types:
          - boolean
        shareFoldersAndStreams:
          type: boolean
          description: A user with this profile can share folders and streams from Your Library with other team members, if set, "permissionLevel" must not be "none".
          example: true
          exampleSetFlag: true
          types:
          - boolean
      description: Library folder access permission.
      exampleSetFlag: false
      types:
      - object
    PermissionProfileUsersResponse:
      type: object
      properties:
        requestId:
          type: string
          description: A Gong request reference Id, generated for this request. Can be used for troubleshooting purposes.
          example: 4al018gzaztcr8nbukw
          exampleSetFlag: true
          types:
          - string
        users:
          type: array
          description: A list, in which each item specifies a user attached to the permission profile.
          exampleSetFlag: false
          items:
            $ref: '#/components/schemas/UserSimpleMetadata'
            exampleSetFlag: false
          types:
          - array
      exampleSetFlag: false
      types:
      - object
    CoachingAccessWithPermissionLevel:
      type: object
      properties:
        permissionLevel:
          type: string
          description: Permission access scope.
          exampleSetFlag: false
          types:
          - string
          enum:
          - all
          - managers-team
          - report-to-them
          - own
          - account
          - none
          - all / managers-team / report-to-them / own / none / account
        teamLeadIds:
          uniqueItems: true
          type: array
          description: 'List of user IDs to populate the managers-team permission level


            You can retrieve the user ids by using the “Users” API.'
          example:
          - '295738305212375930'
          exampleSetFlag: true
          items:
            type: string
            description: 'List of user IDs to populate the managers-team permission level


              You can retrieve the user ids by using the “Users” API.'
            example: '["295738305212375930"]'
            exampleSetFlag: true
            types:
            - string
          types:
          - array
      description: Coaching access permission.
      exampleSetFlag: false
      types:
      - object
    CallAccessDetails:
      type: object
      properties:
        callId:
          type: string
          description: Gong's unique numeric call ID.
          example: '7782342274025937895'
          exampleSetFlag: true
          types:
          - string
        users:
          type: array
          description: A list of users having access.
          exampleSetFlag: false
          items:
            $ref: '#/components/schemas/UserAccessDetails'
            exampleSetFlag: false
          types:
          - array
      description: Call access details
      exampleSetFlag: false
      types:
      - object
    ErrorResponse:
      type: object
      properties:
        requestId:
          type: string
          description: A Gong request reference Id, generated for this request. Can be used for troubleshooting purposes.
          example: 4al018gzaztcr8nbukw
          exampleSetFlag: true
          types:
          - string
        errors:
          type: array
          description: Error messages.
          example:
          - An error has occurred
          exampleSetFlag: true
          items:
            type: string
            exampleSetFlag: false
            types:
            - string
          types:
          - array
      exampleSetFlag: false
      types:
      - object
    EmailsAccessWithPermissionLevel:
      type: object
      properties:
        permissionLevel:
          type: string
          description: Permission access scope.
          exampleSetFlag: false
          types:
          - string
          enum:
          - all
          - managers-team
          - report-to-them
          - own
          - account
          - none
          - all / managers-team / report-to-them / own / none / account
        teamLeadIds:
          uniqueItems: true
          type: array
          description: 'List of user IDs to populate the managers-team permission level


            You can retrieve the user ids by using the “Users” API.'
          example:
          - '295738305212375930'
          exampleSetFlag: true
          items:
            type: string
            description: 'List of user IDs to populate the managers-team permission level


              You can retrieve the user ids by using the “Users” API.'
            example: '["295738305212375930"]'
            exampleSetFlag: true
            types:
            - string
          types:
          - array
      description: Emails access permission.
      exampleSetFlag: false
      types:
      - object
    UserSimpleMetadata:
      type: object
      properties:
        id:
          type: string
          description: Gong's unique numeric identifier for the user (up to 20 digits).
          example: '234599484848423'
          exampleSetFlag: true
          types:
          - string
        fullName:
          type: string
          description: The full name of the Gong user.
          example: Jon
          exampleSetFlag: true
          types:
          - string
        emailAddress:
          type: string
          description: The email address of the Gong user.
          example: test@test.com
          exampleSetFlag: true
          types:
          - string
      description: A list, in which each item specifies a user attached to the permission profile.
      exampleSetFlag: false
      types:
      - object
    ForecastAccess:
      type: object
      properties:
        permissionLevel:
          type: string
          description: Permission access scope.
          exampleSetFlag: false
          types:
          - string
          enum:
          - all
          - managers-team
          - report-to-them
          - own
          - account
          - none
          - all / managers-team / report-to-them / own / none / account
        teamLeadIds:
          uniqueItems: true
          type: array
          description: 'List of user IDs to populate the managers-team permission level


            You can retrieve the user ids by using the “Users” API.'
          example:
          - '295738305212375930'
          exampleSetFlag: true
          items:
            type: string
            description: 'List of user IDs to populate the managers-team permission level


              You can retrieve the user ids by using the “Users” API.'
            example: '["295738305212375930"]'
            exampleSetFlag: true
            types:
            - string
          types:
          - array
      description: User can view forecast submissions.
      exampleSetFlag: false
      types:
      - object
    UserAccessDetails:
      type: object
      properties:
        userId:
          type: string
          description: Gong's unique numeric user ID.
          example: '234599484848423'
          exampleSetFlag: true
          types:
          - string
      description: User access details
      exampleSetFlag: false
      types:
      - object
    CallsAccessDetailsResponse:
      type: object
      properties:
        requestId:
          type: string
          description: A Gong request reference Id, generated for this request. Can be used for troubleshooting purposes.
          example: 4al018gzaztcr8nbukw
          exampleSetFlag: true
          types:
          - string
        callAccessList:
          type: array
          description: A list, in which each item specifies a call & users with access to this call.
          exampleSetFlag: false
          items:
            $ref: '#/components/schemas/CallAccessDetails'
            exampleSetFlag: false
          types:
          - array
      exampleSetFlag: false
      types:
      - object
    PermissionProfilesResponse:
      type: object
      properties:
        requestId:
          type: string
          description: A Gong request reference Id, generated for this request. Can be used for troubleshooting purposes.
          example: 4al018gzaztcr8nbukw
          exampleSetFlag: true
          types:
          - string
        profiles:
          type: array
          description: A list, in which each item specifies a permission profile.
          exampleSetFlag: false
          items:
            $ref: '#/components/schemas/PermissionProfileDTO'
            exampleSetFlag: false
          types:
          - array
      exampleSetFlag: false
      types:
      - object
    PermissionProfileDTO:
      type: object
      properties:
        id:
          type: string
          description: Unique numeric identifier of the permission profile (up to 20 digits).
          example: '3843152912968920037'
          exampleSetFlag: true
          types:
          - string
        name:
          type: string
          description: Permission profile name.
          example: Profile
          exampleSetFlag: true
          types:
          - string
        description:
          type: string
          description: Permission profile description.
          example: Description
          exampleSetFlag: true
          types:
          - string
        callsAccess:
          $ref: '#/components/schemas/CallAccessWithPermissionLevel'
          exampleSetFlag: false
        libraryFolderAccess:
          $ref: '#/components/schemas/LibraryFolderAccess'
          exampleSetFlag: false
        dealsAccess:
