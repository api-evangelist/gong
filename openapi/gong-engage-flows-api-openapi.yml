  /v2/flows:
    get:
      tags:
      - Engage Flows
      summary: List Gong Engage flows (/v2/flows)
      description: 'Engage flows have the following visibility types:


        * Company: visible to everyone in the company, can only be edited by users with edit permissions.


        * Personal: reps can set up their own flows which are only available to them.


        * Shared: reps can share a flow with other reps. Those reps can then add leads to the flow.


        This endpoint returns all company flows, together with personal flows and flows shared with the user specified in the flowEmailOwner parameter.


        Alternatively this endpoint can return the flows most recently assigned by the user.


        When accessed through a Bearer token authorization method, use the ''api:flows:read'' scope.'
      operationId: listFlows
      parameters:
      - name: flowOwnerEmail
        in: query
        description: Email of the Gong user whose personal flows and flows shared with the user you want to return.
        required: true
        style: FORM
        explode: true
        schema:
          type: string
          exampleSetFlag: false
          types:
          - string
        example: test@test.com
      - name: cursor
        in: query
        description: When paging is needed, provide the value supplied by the previous API call to bring the following page of records.
        required: false
        style: FORM
        explode: true
        schema:
          type: string
          exampleSetFlag: false
          types:
          - string
        example: eyJhbGciOiJIUzI1NiJ9.eyJjYWxsSWQiM1M30.6qKwpOcvnuweTZmFRzYdtjs_YwJphJU4QIwWFM
      - name: workspaceId
        in: query
        description: Optional Workspace identifier, if supplied the API will return only the flows belonging to this workspace.
        required: false
        style: FORM
        explode: true
        schema:
          type: string
          exampleSetFlag: false
          types:
          - string
        example: 623457276584334
      - name: folderId
        in: query
        description: Optional Folder identifier, if supplied the API will return only the flows belonging to this particular folder.
        required: false
        style: FORM
        explode: true
        schema:
          type: string
          exampleSetFlag: false
          types:
          - string
        example: 1695493301223573465
      - name: mostRecentlyAssigned
        in: query
        description: Optional flag, if supplied the API will return only the most recently assigned flows capped at 20.
        required: false
        style: FORM
        explode: true
        schema:
          type: boolean
          exampleSetFlag: false
          types:
          - boolean
        example: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowsResponse'
                exampleSetFlag: false
              exampleSetFlag: false
        '400':
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
              exampleSetFlag: false
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
              exampleSetFlag: false
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
              exampleSetFlag: false
        '429':
          description: API request limit exceeded
          headers:
            Retry-After:
              description: Number of seconds to wait before making a new request.
              style: SIMPLE
              explode: false
              schema:
                type: integer
                format: int32
                exampleSetFlag: false
                types:
                - integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
              exampleSetFlag: false
        '500':
          description: Failed to complete the operation due to an unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
              exampleSetFlag: false
  /v2/flows/search:
    get:
      tags:
      - Engage Flows
      summary: Search Gong Engage flows by name (/v2/flows/search)
      description: 'Returns the flows whose name contains the query, case-insensitively, out of the flows the /v2/flows endpoint returns for the user specified in the flowOwnerEmail parameter: company flows, the user''s personal flows and flows shared with the user.


        Flows whose name starts with the query come first, then flows where a word after a space starts with the query, then any other match.


        This endpoint is meant for type-ahead search, so it returns at most 50 flows and has no paging.


        When accessed through a Bearer token authorization method, use the ''api:flows:read'' scope.'
      operationId: searchFlows
      parameters:
      - name: flowOwnerEmail
        in: query
        description: Email of the Gong user whose visible flows you want to search.
        required: true
        style: FORM
        explode: true
        schema:
          type: string
          exampleSetFlag: false
          types:
          - string
        example: test@test.com
      - name: query
        in: query
        description: Text to look for in the flow names. Leading and trailing spaces are ignored. Maximum 256 characters.
        required: true
        style: FORM
        explode: true
        schema:
          type: string
          exampleSetFlag: false
          types:
          - string
        example: renewal
      - name: workspaceId
        in: query
        description: Optional Workspace identifier, if supplied the API will search only the flows belonging to this workspace.
        required: false
        style: FORM
        explode: true
        schema:
          type: string
          exampleSetFlag: false
          types:
          - string
        example: 623457276584334
      - name: limit
        in: query
        description: Optional maximum number of flows to return, between 1 and 50. Default 10.
        required: false
        style: FORM
        explode: true
        schema:
          type: integer
          format: int32
          exampleSetFlag: false
          types:
          - integer
        example: 10
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchFlowsResponse'
                exampleSetFlag: false
              exampleSetFlag: false
        '400':
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
              exampleSetFlag: false
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
              exampleSetFlag: false
        '403':
          description: Forbidden
          content:
            application/json:
