  /v2/flows/folders:
    get:
      tags:
      - Engage Flows
      summary: List Gong Engage flow folders (/v2/flows/folders)
      description: 'Engage flow folders have the following visibility types:


        * Company: visible to everyone in the company, can only be edited by users with edit permissions.


        * Personal: reps can set up their own flow folders which are only available to them.


        * Shared: reps can share a flow folder with other reps. Those reps can then add flows to the flow folder.


        This endpoint returns all company flow folders, together with personal flow folders and flow folders shared with the user specified in the flowEmailOwner parameter.


        When accessed through a Bearer token authorization method, use the ''api:flows:read'' scope.'
      operationId: listFlowsFolders
      parameters:
      - name: flowFolderOwnerEmail
        in: query
        description: Email of the Gong user whose personal flows folders and flows folders shared with the user you want to return.
        required: true
        style: FORM
        explode: true
        schema:
          type: string
          exampleSetFlag: false
          types:
          - string
        example: test@test.com
      - name: cursor
        in: query
        description: When paging is needed, provide the value supplied by the previous API call to bring the following page of records.
