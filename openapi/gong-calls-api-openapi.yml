openapi: 3.2.0
info:
  title: Gong Calls API
  description: 'Overview


    The Gong API allows you to:


    Receive the following information from Gong:


    Your company''s calls in Gong


    Your company''s users in Gong


    Your company''s user stats in Gong


    Your company''s user settings in Gong


    Your company''s libraries in Gong


    Upload new or

    update

    call recordings in Gong, in order to support cases where you have an internal system that records

    calls or obtains them from a third-party entity.


    Data Privacy:

    Delete users and all their associated elements.


    Upload CRM data into Gong.


    Check here what''s your base URL for all API calls.


    Authentication


    There are two ways to retrieve credentials to the Gong Public API:


    Retrieve Manually:


    In the Gong API Page (you

    must be a technical administrator in Gong), click "Create" to receive an Access Key

    and an Access Key Secret.


    Use the Basic Authorization HTTP header (as per RFC)

    to access the Public API as shown below:


    Authorization: Basic <token>


    To create the basic token, combine the Access Key and the Access Key Secret with

    colon (:) and then encode in Base64 as following:


    Base64(<accessKey> : <accessKeySecret>)


    Retrieve through OAuth


    To obtain the Bearer token, follow the steps described in the Gong OAuth Guide.


    After obtaining the token, use the Bearer Authorization HTTP header

    (as per RFC)

    to access the Public API as shown below:


    Authorization: Bearer <token>


    Limits


    By default Gong limits your company''s access to the service to 3 API calls per second, and 10,000 API calls per day.


    When the rate of API calls exceeds these limits an HTTP status code 429 is returned and a Retry-After header indicates

    how many seconds to wait before making a new request.


    If required, contact help.gong.io to change these limits.


    Cursors


    Some API calls that return a list are limited in the amount of records they may return, so multiple API calls may be

    required to bring all records. Such an API call also returns a records field, which contains the number of records

    in the current page, the current page number and the total number of records.


    In cases where the total number of records exceeds the number of records thus far retrieved, the records field will also

    contain a cursor field which can be used to access the next page of records. To retrieve the next page, repeat the API call with

    the cursor value as supplied by the previous API call. All other request inputs should remain the same.


    Forward Compatibility


    When coding a system to accept Gong data, take into account that Gong may, without prior warning, add fields to the JSON output.

    It is recommended to future proof your code so that it disregards all JSON fields you don''t actually use.'
  version: V2
servers:
- url: https://127.0.0.1:8443
  description: Generated server url
tags:
- name: Calls
  description: 'Gong’s “Calls” API endpoints allow you to:


    Request calls details from Gong


    Upload new calls to Gong


    Update Gong Calls with new media


    The requested calls may contain the following call details:


    Meta Data (Basic details such as call date, title, call URL, etc)


    Parties (A list of the call''s participants)


    Media (The media urls of the call)


    Content (Analysis of the interaction content)


    Action Items (A list of action items)


    Structure (A list of the agenda of each part of the call)


    Topics (A list of topics and their durations)


    Trackers (A list of trackers found in the call. Trackers are collections of phrases defined in Gong for this company)


    Phrases (A list of occurrence counters for each specific phrase within the tracker (e.g., Amazon, Walmart))


    Context (A list of links to external systems such as CRM, Dialer, Case Management, etc)


    Interaction (Metrics collected around the interaction during the call)


    Interaction Stats (A list of interaction statistics. Applicable values: ''Talk Ratio'', ''Longest Monologue'',

    ''Longest Customer Story'', ''Interactivity'', ''Patience'')


    Questions (Question counts of the call)


    Speakers (A list of the talk duration per speaker)


    Video (A list of video statistics about what''s presented and for how long)


    Collaboration (Collaboration information added to the call)


    Public Comments (A list of public comments)


    Context (A list of links to external systems such as CRM, Dialer, Case Management, etc)


    Objects (List of objects within the external system)


    Fields (Object fields)'
paths:
  /v2/calls:
    get:
      tags:
      - Calls
      summary: Retrieve call data by date range (/v2/calls)
      description: 'List calls that took place during a specified date range.


        When accessed through a Bearer token authorization method, this endpoint requires the scope ''api:calls:read:basic''.'
      operationId: listCalls
      parameters:
      - name: cursor
        in: query
        description: When paging is needed, provide the value supplied by the previous API call to bring the following page of records.
        required: false
        style: FORM
        explode: true
        schema:
          type: string
          exampleSetFlag: false
          types:
          - string
        example: eyJhbGciOiJIUzI1NiJ9.eyJjYWxsSWQiM1M30.6qKwpOcvnuweTZmFRzYdtjs_YwJphJU4QIwWFM
      - name: fromDateTime
        in: query
        description: 'Date and time (in ISO-8601 format: ''2018-02-18T02:30:00-07:00'' or ''2018-02-18T08:00:00Z'', where Z stands for UTC) from which to list recorded calls. Returns calls that started on or after the specified date and time. If not provided, list starts with earliest call. For web-conference calls recorded by Gong, the date denotes its scheduled time, otherwise, it denotes its actual start time.'
        required: true
        style: FORM
        explode: true
        schema:
          type: string
          exampleSetFlag: false
          types:
          - string
      - name: toDateTime
        in: query
        description: 'Date and time (in ISO-8601 format: ''2018-02-18T02:30:00-07:00'' or ''2018-02-18T08:00:00Z'', where Z stands for UTC) until which to list recorded calls. Returns calls that started up to but excluding specified date and time. If not provided, list ends with most recent call. For web-conference calls recorded by Gong, the date denotes its scheduled time, otherwise, it denotes its actual start time.'
        required: true
        style: FORM
        explode: true
        schema:
          type: string
          exampleSetFlag: false
          types:
          - string
      - name: workspaceId
        in: query
        description: Optional Workspace identifier, if supplied the API will return only the calls belonging to this workspace.
        required: false
        style: FORM
        explode: true
        schema:
          type: string
          exampleSetFlag: false
          types:
          - string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallsResponse'
                exampleSetFlag: false
              exampleSetFlag: false
        '400':
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
              exampleSetFlag: false
        '401':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
              exampleSetFlag: false
        '404':
          description: No calls found for the specified period
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
              exampleSetFlag: false
        '429':
          description: API request limit exceeded
          headers:
            Retry-After:
              description: Number of seconds to wait before making a new request.
              style: SIMPLE
              explode: false
              schema:
                type: integer
                format: int32
                exampleSetFlag: false
                types:
                - integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
              exampleSetFlag: false
        '500':
          description: Failed to complete the operation due to an unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
              exampleSetFlag: false
    post:
      tags:
      - Calls
      summary: Add new call (/v2/calls)
      description: 'When using this endpoint, either provide a downloadMediaUrl or use the returned callId in a follow-up request to /v2/calls/{id}/media to upload the media file.


        When accessed through a Bearer token authorization method, this endpoint requires the scope ''api:calls:create''.'
      operationId: addCall
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewCallAddingRequest'
              exampleSetFlag: false
            exampleSetFlag: false
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewCallAddingResponse'
                exampleSetFlag: false
              exampleSetFlag: false
        '400':
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
              exampleSetFlag: false
        '401':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
              exampleSetFlag: false
        '409':
          description: Conflict, e.g. recording is not enabled for the primary user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
              exampleSetFlag: false
        '429':
          description: API request limit exceeded
          headers:
            Retry-After:
              description: Number of seconds to wait before making a new request.
              style: SIMPLE
              explode: false
              schema:
                type: integer
                format: int32
                exampleSetFlag: false
                types:
                - integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
              exampleSetFlag: false
        '500':
          description: Failed to complete the operation due to an unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
              exampleSetFlag: false
  /v2/calls/{id}/media:
    put:
      tags:
      - Calls
      summary: Add call media (/v2/calls/{id}/media)
      description: 'Adds a call media, recorded by a telephony system (PBX) or other media recording facility. Gong accepts call recordings in various audio and video file formats, including WAV, MP3, MP4, MKV and FLAC. If uploading a dual-channel (stereo) file separated by speaker, make sure to specify which channel correspondsto the company team member (rep) in the parties/mediaChannelId parameter of the Add New Call operation.


        When accessed through a Bearer token authorization method, this endpoint requires the scope ''api:calls:create''.'
      operationId: addCallRecording
      parameters:
      - name: id
        in: path
        description: callId returned from 'Add New Call' request
        required: true
        style: SIMPLE
        explode: false
        schema:
          type: string
          exampleSetFlag: false
          types:
          - string
      requestBody:
        content:
          multipart/form-data:
            schema:
              required:
              - mediaFile
              type: object
              properties:
                mediaFile:
                  type: string
                  description: The media file of the recording. You may attach files up to 1.5GB in size.
                  format: binary
                  exampleSetFlag: false
                  types:
                  - string
              exampleSetFlag: false
              types:
              - object
            exampleSetFlag: false
        required: true
      responses:
        '201':
          description: Successfully registered the new call recording
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewCallRecordingResponse'
                exampleSetFlag: false
              exampleSetFlag: false
        '400':
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
              exampleSetFlag: false
        '401':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
              exampleSetFlag: false
        '429':
          description: API request limit exceeded
          headers:
            Retry-After:
              description: Number of seconds to wait before making a new request.
              style: SIMPLE
              explode: false
              schema:
                type: integer
                format: int32
                exampleSetFlag: false
                types:
                - integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
              exampleSetFlag: false
        '500':
          description: Failed to complete the operation due to an unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
              exampleSetFlag: false
  /v2/calls/{id}:
    get:
      tags:
      - Calls
      summary: Retrieve data for a specific call (/v2/calls/{id})
      description: 'Retrieve data for a specific call.


        When accessed through a Bearer token authorization method, this endpoint requires the scope ''api:calls:read:basic''.'
      operationId: getCall
      parameters:
      - name: id
        in: path
        description: Gong's unique numeric identifier for the call (up to 20 digits).
        required: true
        style: SIMPLE
        explode: false
        schema:
          type: string
          exampleSetFlag: false
          types:
          - string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpecificCall'
                exampleSetFlag: false
              exampleSetFlag: false
        '400':
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
              exampleSetFlag: false
        '401':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
              exampleSetFlag: false
        '404':
          description: Call ID was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
              exampleSetFlag: false
        '429':
          description: API request limit exceeded
          headers:
            Retry-After:
              description: Number of seconds to wait before making a new request.
              style: SIMPLE
              explode: false
              schema:
                type: integer
                format: int32
                exampleSetFlag: false
                types:
                - integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
              exampleSetFlag: false
        '500':
          description: Failed to complete the operation due to an unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
              exampleSetFlag: false
  /v2/calls/extensive:
    post:
      tags:
      - Calls
      summary: Retrieve detailed call data by various filters (/v2/calls/extensive)
      description: 'Lists detailed call data for calls that took place during a specified date range, have specified call IDs or hosted by specified users.


        When accessed through a Bearer token authorization method, this endpoint requires the scope ''api:calls:read:extensive''.

        Moreover, clients requesting media download URLs by the contentSelector.exposedFields.media field should also have the scope ''api:calls:read:media-url''.'
      operationId: listCallsExtensive
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicApiBaseRequestWithDataV2CallsRequestFilterWithOwnersContentSelector'
              exampleSetFlag: false
            exampleSetFlag: false
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Calls'
                exampleSetFlag: false
              exampleSetFlag: false
        '400':
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
              exampleSetFlag: false
        '401':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
              exampleSetFlag: false
        '404':
          description: No calls found for the specified period
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
              exampleSetFlag: false
        '429':
          description: API request limit exceeded
          headers:
            Retry-After:
              description: Number of seconds to wait before making a new request.
              style: SIMPLE
              explode: false
