          description: Failed to complete the operation due to an unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
              exampleSetFlag: false
  /v2/calls/transcript:
    post:
      tags:
      - Calls
      summary: Retrieve transcripts of calls (/v2/calls/transcript)
      description: 'Returns transcripts for calls that took place during the specified date period. If call IDs are specified, only transcripts for calls with those IDs that took place during the time period are returned.


        When accessed through a Bearer token authorization method, this endpoint requires the scope ''api:calls:read:transcript''.'
      operationId: getCallTranscripts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicApiBaseRequestV2CallsFilter'
              exampleSetFlag: false
            exampleSetFlag: false
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallTranscripts'
                exampleSetFlag: false
              exampleSetFlag: false
        '400':
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
              exampleSetFlag: false
        '401':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
