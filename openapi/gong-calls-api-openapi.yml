components:
  schemas:
    Monologue:
      type: object
      properties:
        speakerId:
          type: string
          description: 'Unique ID of the speaker. Cross-reference this with the ''speakerId'' field of objects in the ''parties'' array returned from endpoint ''/v2/calls/extensive'' to identify the participant. '
          example: '6432345678555530067'
          exampleSetFlag: true
          types:
          - string
        topic:
          type: string
          description: The name of the topic.
          example: Objections
          exampleSetFlag: true
          types:
          - string
        sentences:
          type: array
          description: A list of sentences spoken in the monologue.
          exampleSetFlag: false
          items:
            $ref: '#/components/schemas/Sentence'
            exampleSetFlag: false
          types:
          - array
      description: List of monologues.
      exampleSetFlag: false
      types:
      - object
    CallTranscripts:
      type: object
      properties:
        requestId:
          type: string
          description: A Gong request reference Id, generated for this request. Can be used for troubleshooting purposes.
          example: 4al018gzaztcr8nbukw
          exampleSetFlag: true
          types:
          - string
        records:
          $ref: '#/components/schemas/Records'
          exampleSetFlag: false
        callTranscripts:
          type: array
          description: A list with one entry per call.
          exampleSetFlag: false
          items:
            $ref: '#/components/schemas/CallTranscript'
            exampleSetFlag: false
          types:
          - array
      exampleSetFlag: false
      types:
      - object
    ExternalCrmCallObject:
      required:
      - objectId
      - objectType
      type: object
      properties:
        objectType:
          type: string
          description: Object Type. e.g. Account.
          example: Account
          exampleSetFlag: true
          types:
          - string
          enum:
          - Opportunity
          - Account
          - Lead
          - Contact
          - User
          - Opportunity,Account
        objectId:
          type: string
          description: Object ID. For Salesforce both case-sensitive and case-insensitive formats are supported.
          example: 0013601230sV7grAAC
          exampleSetFlag: true
          types:
          - string
        fields:
          type: array
          description: Object fields. Intended for future use only.
          exampleSetFlag: false
          items:
            $ref: '#/components/schemas/ContextField'
            exampleSetFlag: false
          types:
          - array
      description: External object associated with the call
      exampleSetFlag: false
      types:
      - object
    CallsResponse:
      type: object
      properties:
        requestId:
          type: string
          description: A Gong request reference Id, generated for this request. Can be used for troubleshooting purposes.
          example: 4al018gzaztcr8nbukw
          exampleSetFlag: true
          types:
          - string
        records:
          $ref: '#/components/schemas/Records'
          exampleSetFlag: false
        calls:
          type: array
          description: A list, in which each item specifies one call.
          exampleSetFlag: false
          items:
            $ref: '#/components/schemas/CallBasicData'
            exampleSetFlag: false
          types:
          - array
      exampleSetFlag: false
      types:
      - object
    ContextField:
      type: object
      properties:
        name:
          type: string
          description: 'Field name. For Account supported fields are: Name, Website, Industry and all the custom fields. For Opportunity supported fields are Name, LeadSource, Type, StageName, Probability, Amount, CloseDate and all the custom fields.'
          example: name
          exampleSetFlag: true
          types:
          - string
        value:
          type: object
          description: Field value
          example: Gong Inc.
          exampleSetFlag: true
          types:
          - object
      description: External object data
      exampleSetFlag: false
      types:
      - object
    CallUploadContext:
      required:
      - system
      type: object
      properties:
        system:
          type: string
          description: External system name. Currently only Salesforce and Generic are supported.
          example: Salesforce
          exampleSetFlag: true
          types:
          - string
          enum:
          - Salesforce
          - HubSpot
          - MicrosoftDynamic
          - Generic
        objects:
          type: array
          description: 'List of objects within the external system. Note: Multiple opportunities/deals belonging to the same account are not supported.'
          exampleSetFlag: false
          items:
            $ref: '#/components/schemas/ExternalCrmCallObject'
            exampleSetFlag: false
          types:
          - array
      description: Links to external systems such as CRM, Telephony System, Case Management etc. Currently only Salesforce and Generic are supported.
      exampleSetFlag: false
      types:
      - object
    ErrorResponse:
      type: object
      properties:
        requestId:
          type: string
          description: A Gong request reference Id, generated for this request. Can be used for troubleshooting purposes.
          example: 4al018gzaztcr8nbukw
          exampleSetFlag: true
          types:
          - string
        errors:
          type: array
          description: Error messages.
          example:
          - An error has occurred
          exampleSetFlag: true
          items:
            type: string
            exampleSetFlag: false
            types:
            - string
          types:
          - array
      exampleSetFlag: false
      types:
      - object
    trackerPhrases:
      type: object
      properties:
        count:
          type: integer
          description: The number of times this phrase was mentioned in the call.
          format: int32
          example: 5
          exampleSetFlag: true
          types:
          - integer
        occurrences:
          type: array
          description: Lists when each keyword tracker phrase was mentioned in the call.
          exampleSetFlag: false
          items:
            $ref: '#/components/schemas/occurrences'
            exampleSetFlag: false
          types:
          - array
        phrase:
          type: string
          description: The specific phrase within the tracker (e.g., Walmart).
          example: Walmart
          exampleSetFlag: true
          types:
          - string
      exampleSetFlag: false
      types:
      - object
    ExternalCallObject:
      type: object
      properties:
        objectType:
          type: string
          description: Object Type. e.g Opportunity.
          example: Opportunity
          exampleSetFlag: true
          types:
          - string
          enum:
          - Opportunity
          - Account
        objectId:
          type: string
          description: Object ID
          example: 0013601230sV7grAAC
          exampleSetFlag: true
          types:
          - string
        fields:
          type: array
          exampleSetFlag: false
          items:
            $ref: '#/components/schemas/ContextField'
            exampleSetFlag: false
          types:
          - array
        timing:
          type: string
          description: Timing of object
          exampleSetFlag: false
          types:
          - string
          enum:
          - Now
          - TimeOfCall
      description: External Object
      exampleSetFlag: false
      types:
      - object
    Records:
      type: object
      properties:
        totalRecords:
          type: integer
          description: Total number of records.
          format: int32
          example: 263
          exampleSetFlag: true
          types:
          - integer
        currentPageSize:
          type: integer
          description: Number of records in the current page.
          format: int32
          example: 100
          exampleSetFlag: true
          types:
          - integer
        currentPageNumber:
          type: integer
          description: Current page number.
          format: int32
          example: 0
          exampleSetFlag: true
          types:
          - integer
        cursor:
          type: string
