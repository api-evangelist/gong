components:
  schemas:
    NewMeetingResponse:
      type: object
      properties:
        requestId:
          type: string
          description: A Gong request reference Id, generated for this request. Can be used for troubleshooting purposes.
          example: 4al018gzaztcr8nbukw
          exampleSetFlag: true
          types:
          - string
        meetingId:
          type: string
          description: Gong's unique identifier for the meeting (up to 20 digits).
          example: '7782342274025937895'
          exampleSetFlag: true
          types:
          - string
        meetingUrl:
          type: string
          description: The Gong URL of the meeting, should be used to enter the meeting.
          example: https://join.gong.io/my-company/jon.snow?tkn=MoNpS9tMNt8BK7EZxQpSJl
          exampleSetFlag: true
          types:
          - string
        additionalInvitees:
          type: array
          description: Attendees the requesting party should add to the invitation, this should support adding email addresses such as coordinator@gong.io for Gong to schedule the recording of the meeting.
          example:
          - displayName: Gong Assistant
            email: assistant@gong.io
          exampleSetFlag: true
          items:
            $ref: '#/components/schemas/MeetingInvitee'
            exampleSetFlag: false
          types:
          - array
      exampleSetFlag: false
      types:
      - object
    UpdateMeetingResponse:
      type: object
      properties:
        requestId:
          type: string
          description: A Gong request reference Id, generated for this request. Can be used for troubleshooting purposes.
          example: 4al018gzaztcr8nbukw
          exampleSetFlag: true
          types:
          - string
        meetingId:
          type: string
          description: The unique meeting identifier of the meeting.
          example: '7782342274025937895'
          exampleSetFlag: true
          types:
          - string
      exampleSetFlag: false
      types:
      - object
    IntegrationStatusRequest:
      type: object
      properties:
        emails:
          type: array
          description: String array of emails of users (max 100)
          exampleSetFlag: false
          items:
            type: string
            description: String array of emails of users (max 100)
            exampleSetFlag: false
            types:
            - string
          types:
          - array
      exampleSetFlag: false
      types:
      - object
    DeleteMeetingRequest:
      type: object
      properties:
        organizerEmail:
          type: string
          description: The email address of the user who created the meeting.
          example: test@test.com
          exampleSetFlag: true
          types:
          - string
      description: Meeting update metadata
      exampleSetFlag: false
      types:
      - object
    User_Integration_Status:
      type: object
      properties:
        email:
          type: string
          description: The email address meeting organizer
          example: test@test.com
          exampleSetFlag: true
          types:
          - string
        exists:
          type: boolean
          description: Whether the user exists in Gong
          example: true
          exampleSetFlag: true
          types:
          - boolean
        valid:
          type: boolean
          description: User-level validation - whether the integration is connected
          example: false
          exampleSetFlag: true
          types:
          - boolean
        userFacingError:
          type: string
          description: The message explaining in case the integration is currently not connected
          example: The Gong consent page is not enabled in your company. Contact your Gong Admin.
          exampleSetFlag: true
          types:
          - string
        fixUrl:
          type: string
          description: A URL to place in the application to fix the problem
          example: https://app.gong.io/company/recording-consent/consent-page
          exampleSetFlag: true
          types:
          - string
        helpUrl:
          type: string
          description: A URL to the Gong help center where more information can be found about the error
          example: https://help.gong.io/hc/en-us/articles/360056677792
          exampleSetFlag: true
          types:
          - string
      description: The integration status for the request users
      exampleSetFlag: false
      types:
      - object
    IntegrationStatusResponse:
      type: object
      properties:
        requestId:
          type: string
          description: A Gong request reference Id, generated for this request. Can be used for troubleshooting purposes.
          example: 4al018gzaztcr8nbukw
          exampleSetFlag: true
          types:
          - string
        users:
          type: array
          description: The integration status for the request users
          exampleSetFlag: false
          items:
            $ref: '#/components/schemas/User_Integration_Status'
            exampleSetFlag: false
          types:
          - array
      exampleSetFlag: false
      types:
      - object
    MeetingInvitee:
      type: object
      properties:
        email:
          type: string
          description: The unique meeting to identify the meeting.
          example: test@test.com
          exampleSetFlag: true
          types:
          - string
        displayName:
          type: string
          description: The name of the person.
          example: Test User
          exampleSetFlag: true
          types:
          - string
        firstName:
          type: string
          description: The first name of the person, if available.
          example: Jon
          exampleSetFlag: true
          types:
          - string
        lastName:
          type: string
          description: The last name of the person, if available.
          example: Snow
          exampleSetFlag: true
          types:
          - string
      description: Attendees the requesting party should add to the invitation, this should support adding email addresses such as coordinator@gong.io for Gong to schedule the recording of the meeting.
      example:
      - displayName: Gong Assistant
        email: assistant@gong.io
      exampleSetFlag: true
      types:
      - object
    ErrorResponse:
      type: object
      properties:
        requestId:
          type: string
          description: A Gong request reference Id, generated for this request. Can be used for troubleshooting purposes.
          example: 4al018gzaztcr8nbukw
          exampleSetFlag: true
          types:
          - string
        errors:
          type: array
          description: Error messages.
          example:
          - An error has occurred
          exampleSetFlag: true
          items:
            type: string
            exampleSetFlag: false
            types:
            - string
          types:
          - array
      exampleSetFlag: false
      types:
      - object
    NewMeetingRequest:
      required:
      - endTime
      - invitees
      - organizerEmail
      - startTime
      type: object
      properties:
        startTime:
          type: string
          description: The meeting start time in ISO-8601 format (e.g., '2018-02-18T02:30:00-07:00' or '2018-02-18T08:00:00Z', where Z stands for UTC).
          example: '2018-02-17T02:30:00-08:00'
          exampleSetFlag: true
          types:
          - string
        endTime:
          type: string
          description: The meeting end time in ISO-8601 format (e.g., '2018-02-18T02:30:00-07:00' or '2018-02-18T08:00:00Z', where Z stands for UTC).
          example: '2018-02-19T02:30:00-08:00'
          exampleSetFlag: true
          types:
          - string
        title:
          type: string
          description: Title of the event.
          example: Example call
          exampleSetFlag: true
          types:
          - string
        invitees:
          type: array
          description: A list of email addresses of invitees to the event (not including the organizer).
          example:
          - displayName: Cookie Monster
            email: cookie.monster@cookies.com
          exampleSetFlag: true
          items:
            $ref: '#/components/schemas/MeetingInvitee'
            exampleSetFlag: false
          types:
          - array
        externalId:
          type: string
          description: The ID as it is formed on the external system.
          example: 7JEHFRGXDDZFEW2FC4U
          exampleSetFlag: true
          types:
          - string
        provider:
          type: string
          description: The web conferencing provider to use for this meeting (e.g. 'zoom'). When not specified, the user's default provider is used.
          example: zoom
          exampleSetFlag: true
          types:
          - string
        organizerEmail:
          type: string
          description: The email address of the user creating the meeting, the Gong consent page link will be used according to the settings of this user.
          example: test@test.com
          exampleSetFlag: true
          types:
          - string
      description: New meeting metadata
      exampleSetFlag: false
      types:
      - object
    UpdateMeetingRequest:
      required:
      - endTime
      - invitees
      - organizerEmail
      - startTime
      type: object
      properties:
        startTime:
          type: string
          description: The meeting start time in ISO-8601 format (e.g., '2018-02-18T02:30:00-07:00' or '2018-02-18T08:00:00Z', where Z stands for UTC).
          example: '2018-02-17T02:30:00-08:00'
          exampleSetFlag: true
          types:
          - string
        endTime:
          type: string
          description: The meeting end time in ISO-8601 format (e.g., '2018-02-18T02:30:00-07:00' or '2018-02-18T08:00:00Z', where Z stands for UTC).
          example: '2018-02-19T02:30:00-08:00'
          exampleSetFlag: true
          types:
          - string
        title:
          type: string
          description: Title of the event.
          example: Example call
          exampleSetFlag: true
          types:
          - string
        invitees:
          type: array
          description: A list of email addresses of invitees to the event (not including the organizer).
          example:
          - displayName: Cookie Monster
            email: cookie.monster@cookies.com
          exampleSetFlag: true
          items:
            $ref: '#/components/schemas/MeetingInvitee'
            exampleSetFlag: false
          types:
          - array
        externalId:
          type: string
          description: The ID as it is formed on the external system.
          example: 7JEHFRGXDDZFEW2FC4U
          exampleSetFlag: true
          types:
          - string
        provider:
          type: string
          description: The web conferencing provider to use for this meeting (e.g. 'zoom'). When not specified, the user's default provider is used.
          example: zoom
          exampleSetFlag: true
          types:
          - string
        organizerEmail:
          type: string
          description: The email address of the user who created the meeting.
          example: test@test.com
          exampleSetFlag: true
          types:
          - string
      description: Meeting update metadata
      exampleSetFlag: false
      types:
      - object
