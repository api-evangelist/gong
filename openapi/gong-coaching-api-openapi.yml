    CoachingUser:
      type: object
      properties:
        id:
          type: string
          description: Gong's unique numeric identifier for the user (up to 20 digits).
          example: '234599484848423'
          exampleSetFlag: true
          types:
          - string
        emailAddress:
          type: string
          description: The email address of the Gong user.
          example: test@test.com
          exampleSetFlag: true
          types:
          - string
        firstName:
          type: string
          description: The first name of the Gong user.
          example: Jon
          exampleSetFlag: true
          types:
          - string
        lastName:
          type: string
          description: The last name of the Gong user.
          example: Snow
          exampleSetFlag: true
          types:
          - string
        title:
          type: string
          description: The job title of the Gong user.
          example: Enterprise Account Executive
          exampleSetFlag: true
          types:
          - string
      exampleSetFlag: false
      types:
      - object
    CoachingRepData:
