- status: 401
  title: Unauthorized — invalid or missing authentication credentials
  media_type: application/json
  schema: ErrorResponse
  occurrences: 57
  remediation: >-
    Re-check the Authorization header. For Basic auth the token is
    Base64(accessKey:accessKeySecret); for OAuth the Bearer token expires after
    1 day by default and must be refreshed with the refresh token. OAuth clients
    must also call the per-customer host from api_base_url_for_customer — calling
    the generic api.gong.io host with a customer token is a common 401 cause.
- status: 403
  title: Forbidden — request originated from an untrusted IP address
  media_type: application/json
  schema: ErrorResponse
  occurrences: 0
  in_spec: false
  source: https://help.gong.io/docs/receive-access-to-the-api
  remediation: >-
    Documented by Gong but absent from every OpenAPI. An API key may carry a
    Trusted IPs allowlist; a request from any other address is rejected with 403.
    Add the caller's egress IP/CIDR to the key (changes take up to five minutes)
    or clear the allowlist.
- status: 404
  title: Resource not found
  media_type: application/json
  schema: ErrorResponse
  occurrences: 14
  remediation: >-
    The addressed entity does not exist or is not visible to the credential.
    Gong specifically documents that assignProspectsToFlow returns 404 when the
    flowId does not exist or the flow has been deleted.
- status: 429
  title: Rate limit exceeded
  media_type: application/json
  schema: ErrorResponse
  occurrences: 57
  headers: [Retry-After]
  remediation: >-
    Sleep for Retry-After seconds, then retry. Budget against 3 requests/second
    and 10,000 requests/day per company. Because Gong publishes no idempotency
    contract, retrying a write after a 429 that may have partially applied is
    the caller's risk to manage.
