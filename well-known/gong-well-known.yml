method: probed
source: live probe of every Gong host in apis.yml plus the MCP host
note: >-
  Gong serves no /.well-known/ documents from its marketing, app or API hosts —
  www.gong.io and app.gong.io 404 every path, and api.gong.io answers 401 to
  every path because the whole API host is behind Basic/Bearer auth. The real
  discovery surface is on the MCP host, mcp.gong.io, which serves an RFC 8414
  authorization-server metadata document and an RFC 9728 protected-resource
  metadata document anonymously. Those two 200s are the only genuine documents
  found and are what earns the WellKnown pointer; no security.txt is served
  anywhere, so no SecurityTxt pointer is emitted.
hosts:
- host: https://mcp.gong.io
  documents:
  - path: /.well-known/oauth-authorization-server
    status: 200
    file: gong-oauth-authorization-server.json
    spec: RFC 8414
  - path: /.well-known/oauth-protected-resource/mcp
    status: 200
    file: gong-oauth-protected-resource.json
    spec: RFC 9728
  - path: /.well-known/oauth-protected-resource
    status: 401
