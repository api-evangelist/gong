note: >-
  Derived mechanically from schema $ref links and id-reference field names in
  the harvested OpenAPI. Gong publishes no object reference outside its
  authenticated app, so id formats are described from the spec only. Gong ids
  are long unprefixed numeric strings (e.g. "5599332235511222779") — there is no
  Stripe-style type prefix, so an id is NOT self-describing and a caller must
  track which entity an id belongs to.
id_convention:
  format: numeric string
  prefixed: false
  example_source: https://help.gong.io/docs/payload-sent-to-webhooks
  implication: >-
    Because ids carry no type prefix, an agent cannot infer the entity type from
    an identifier alone. Every id must be carried with its field name.
